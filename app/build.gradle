plugins { id 'com.android.application' }
android {
  namespace 'tw.stan.homequiet'; compileSdk 35
  defaultConfig { applicationId 'tw.stan.homequiet'; minSdk 29; targetSdk 35; versionCode 2; versionName '0.2.0' }
  signingConfigs { release { storeFile file('../release.jks'); storePassword 'homequiet'; keyAlias 'hq'; keyPassword 'homequiet' } }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false }
}
dependencies { implementation 'com.google.android.material:material:1.12.0'; implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'com.google.android.gms:play-services-location:21.3.0' }
