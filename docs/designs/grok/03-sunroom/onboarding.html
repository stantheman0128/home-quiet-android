<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, height=844">
<title>在家安靜 — 開始 · 日光房</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 390px; height: 844px; margin: 0; overflow: hidden;
    background: #E8D2B6;
    color: #1C2430;
    font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; padding: 12px 12px 0; }
  a { color: inherit; text-decoration: none; }

  .glass {
    flex: 1; min-height: 0;
    background: linear-gradient(180deg, #C5DFF6 0%, #E7F3FC 46%, #F8E6CC 100%);
    border-radius: 22px 22px 0 0;
    padding: 16px 20px 18px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .folio {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 700;
  }
  .folio span { color: #5E6A78; font-weight: 400; font-size: 12px; letter-spacing: 0.08em; }

  .sun {
    margin: 18px auto 0; width: 148px; height: 148px; flex: none;
  }
  h1 {
    margin-top: 16px;
    font-size: 52px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.02;
  }
  .lead {
    margin-top: 12px;
    font-size: 16px; line-height: 1.6; color: #243040; max-width: 300px;
  }
  ul { margin-top: auto; display: flex; flex-direction: column; gap: 8px; list-style: none; }
  li {
    background: rgba(255,251,246,.78);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex; gap: 10px; align-items: center;
    font-size: 13px; line-height: 1.45;
    box-shadow: 0 6px 16px rgba(60,40,20,.05);
  }
  li i {
    width: 8px; height: 8px; border-radius: 50%; background: #E25B38; flex: none;
  }
  .steps {
    margin-top: 14px; display: flex; gap: 6px; align-items: center;
  }
  .steps b, .steps i {
    display: block; height: 6px; border-radius: 99px; background: rgba(28,36,48,.16);
  }
  .steps i { width: 6px; }
  .steps b { width: 22px; background: #E25B38; }

  .sill {
    flex: none; height: 104px;
    display: flex; align-items: center; padding: 0 8px 10px;
  }
  .go {
    flex: 1; height: 56px; border-radius: 16px;
    background: #1C2430; color: #FFFBF6;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <section class="glass">
    <div class="folio"><span>16:48</span><span>01 / 06</span></div>
    <svg class="sun" viewBox="0 0 148 148" aria-hidden="true">
      <defs>
        <radialGradient id="g" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#FFF6E4"/>
          <stop offset="55%" stop-color="#FFC56A"/>
          <stop offset="100%" stop-color="#F0993C"/>
        </radialGradient>
      </defs>
      <circle cx="74" cy="74" r="70" fill="none" stroke="#1C2430" stroke-opacity="0.22" stroke-width="1.4" stroke-dasharray="1.5 4"/>
      <circle cx="74" cy="74" r="34" fill="url(#g)"/>
      <circle cx="74" cy="74" r="3" fill="#1C2430" opacity="0.45"/>
    </svg>
    <h1>到家<br>就安靜</h1>
    <p class="lead">進入你設好的住家範圍時，在家安靜會清掉所選應用的通知。人一離開，通知恢復。</p>
    <ul>
      <li><i></i><span>GPS、Wi-Fi、行動數據都可以，不限定某一種。</span></li>
      <li><i></i><span>預設安靜 Grok Bot，其他的你自己勾。</span></li>
      <li><i></i><span>走出範圍，通知就恢復，不會一直清。</span></li>
    </ul>
    <div class="steps" aria-hidden="true"><b></b><i></i><i></i><i></i><i></i><i></i></div>
  </section>
  <footer class="sill"><div class="go">繼續</div></footer>
</body>
</html>
