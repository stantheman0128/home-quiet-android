<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, height=844">
<title>在家安靜 — 狀態 · 現場儀器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 390px; height: 844px; margin: 0; overflow: hidden;
    background: #E5DDD0; color: #171614;
    font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; font-family: inherit; }
  .mono { font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace; }

  .top {
    height: 38px; flex: none;
    display: flex; align-items: center; gap: 8px; padding: 6px 14px 0;
  }
  .screw {
    width: 13px; height: 13px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #F4EFE6, #B7AFA2 46%, #6E675C 78%);
    box-shadow: inset 0 0 0 1px #5A544A, 0 1px 0 rgba(255,255,255,.55);
    position: relative;
  }
  .screw::after {
    content: ""; position: absolute; left: 2px; right: 2px; top: 5.5px; height: 1.5px;
    background: #3E3A34; border-radius: 1px;
  }
  .clock { font-size: 12px; letter-spacing: 0.12em; }
  .top .sp { flex: 1; }
  .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: #FF4D1C;
    box-shadow: 0 0 0 3px rgba(255,77,28,.16), 0 0 8px rgba(255,77,28,.75);
  }
  .homeword { font-size: 12px; letter-spacing: 0.14em; }

  .brand {
    height: 42px; flex: none;
    display: flex; align-items: center; padding: 0 16px;
  }
  .brand .id { display: flex; flex-direction: column; }
  .brand .id b {
    font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace;
    font-size: 14px; letter-spacing: 0.1em;
  }
  .brand .id span { font-size: 12px; color: #6F685E; margin-top: 1px; }
  .pause { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .pause span { font-size: 12px; color: #6F685E; letter-spacing: 0.08em; }
  .rocker {
    width: 44px; height: 22px; border-radius: 4px; display: block;
    background: #C9C1B3;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.2);
    position: relative;
  }
  .rocker::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 3px;
    background: linear-gradient(#F7F3EC, #D5CCBE);
    box-shadow: 0 1px 0 #fff;
  }

  .main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 8px;
    padding: 4px 14px 8px;
  }

  .lcd {
    flex: 1; min-height: 0;
    background:
      repeating-linear-gradient(to bottom, rgba(20,36,16,.045) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #D2E0B8, #B5C898);
    border-radius: 10px;
    box-shadow: inset 0 0 0 1px #8EA078, inset 0 10px 18px rgba(0,0,0,.05);
    color: #182212;
    padding: 12px 14px 14px;
    display: flex; flex-direction: column;
  }
  .lcd-top, .rl, .ends, .mod .k, .perms {
    font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace;
  }
  .lcd-top {
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: 0.16em; color: #3E5130;
  }
  .read {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .figure { display: flex; align-items: flex-end; gap: 8px; }
  .unit { font-size: 16px; font-weight: 700; padding-bottom: 6px; }
  .ring { flex: none; }
  .verdict strong { display: block; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
  .verdict span { display: block; margin-top: 2px; font-size: 13px; color: #314228; }

  .radius { flex: none; }
  .rl { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: 0.14em; color: #6F685E; }
  .rl b { font-family: "Noto Sans CJK TC", sans-serif; font-size: 14px; letter-spacing: 0; color: #171614; }
  .slot {
    margin-top: 6px; height: 32px; border-radius: 5px; position: relative;
    background: #CFC7B8;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.16);
  }
  .slot .fill {
    position: absolute; left: 8px; top: 14px; height: 4px; width: calc(15.56% - 8px);
    background: #FF4D1C; border-radius: 2px;
  }
  .knob {
    position: absolute; left: 15.56%; top: 50%;
    width: 16px; height: 24px; border-radius: 3px;
    transform: translate(-50%, -50%);
    background: linear-gradient(#F6F1E8, #CFC6B6);
    box-shadow: 0 2px 0 #8D8678, inset 0 1px 0 #fff;
  }
  .knob::after {
    content: ""; position: absolute; left: 3px; right: 3px; top: 11px; height: 2px; background: #FF4D1C;
  }
  .ends { display: flex; justify-content: space-between; margin-top: 3px; font-size: 10px; letter-spacing: 0.08em; color: #8A8276; }

  .duo { flex: none; height: 112px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mod {
    background: #D7CFC1; border-radius: 8px; padding: 10px 12px;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.06), inset 0 0 0 1px rgba(255,255,255,.28);
    display: flex; flex-direction: column; min-width: 0;
  }
  .mod .k { font-size: 10px; letter-spacing: 0.16em; color: #7A7268; }
  .mod .big { margin-top: 4px; font-size: 16px; font-weight: 700; }
  .mod .sub { margin-top: 2px; font-size: 12px; color: #6F685E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mod-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .coords {
    margin-top: 6px;
    font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace;
    font-size: 13px; line-height: 1.35; letter-spacing: 0.01em;
  }

  .latch {
    width: 46px; height: 24px; border-radius: 4px; flex: none; position: relative;
    background: #2A2825; box-shadow: inset 0 2px 3px rgba(0,0,0,.45);
  }
  .latch i {
    position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 2px;
    background: linear-gradient(#F2EBE0, #C9C0B2);
  }
  .latch.on i { left: 25px; background: linear-gradient(#FF8A62, #FF4D1C); }

  .perms {
    flex: none; height: 20px;
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; letter-spacing: 0.08em; color: #4E493F;
  }
  .perms span { display: flex; align-items: center; gap: 4px; }
  .perms i {
    width: 7px; height: 7px; border-radius: 50%; background: #FF4D1C;
    box-shadow: 0 0 5px rgba(255,77,28,.7);
  }
  .perms a { margin-left: auto; letter-spacing: 0.06em; color: #171614; font-weight: 700; }

  .keybtn {
    flex: none; height: 44px; border-radius: 8px;
    background: #171614; color: #F4EFE6;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    box-shadow: 0 3px 0 #0A0908, inset 0 1px 0 rgba(255,255,255,.14);
  }

  nav {
    height: 76px; flex: none;
    display: flex; gap: 8px; padding: 6px 14px 14px;
  }
  nav a {
    flex: 1; border-radius: 8px;
    background: linear-gradient(#F3EEE4, #DDD4C6);
    box-shadow: 0 3px 0 #B7AE9F, inset 0 1px 0 rgba(255,255,255,.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 14px; font-weight: 700;
  }
  nav a em {
    font-style: normal;
    font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.16em; font-weight: 400; color: #7A7368;
  }
  nav a.on {
    background: linear-gradient(#D2CBBE, #C9C1B3);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.16);
    transform: translateY(2px);
  }
  nav a.on em { color: #FF4D1C; }
</style>
</head>
<body>
  <div class="top">
    <i class="screw"></i>
    <span class="clock mono">16:48</span>
    <span class="sp"></span>
    <i class="led"></i>
    <span class="homeword mono">在家</span>
    <i class="screw"></i>
  </div>
  <div class="brand">
    <div class="id"><b>HQ–1</b><span>現場儀器 · 在家安靜</span></div>
    <div class="pause"><span class="mono">暫停</span><i class="rocker" aria-label="暫停關閉"></i></div>
  </div>
  <div class="main">
    <section class="lcd">
      <div class="lcd-top"><span>距離 DIST</span><span>半徑 120</span></div>
      <div class="read">
        <div class="figure">
          <svg class="seg" width="132" height="96" viewBox="0 0 132 96" aria-label="42">
            <g fill="#182212">
              <g opacity="0.16">
                <rect x="14" y="0" width="34" height="10" rx="2"/><rect x="48" y="12" width="10" height="32" rx="2"/><rect x="48" y="52" width="10" height="32" rx="2"/><rect x="14" y="86" width="34" height="10" rx="2"/><rect x="2" y="52" width="10" height="32" rx="2"/><rect x="2" y="12" width="10" height="32" rx="2"/><rect x="14" y="42" width="34" height="10" rx="2"/>
                <rect x="80" y="0" width="34" height="10" rx="2"/><rect x="114" y="12" width="10" height="32" rx="2"/><rect x="114" y="52" width="10" height="32" rx="2"/><rect x="80" y="86" width="34" height="10" rx="2"/><rect x="68" y="52" width="10" height="32" rx="2"/><rect x="68" y="12" width="10" height="32" rx="2"/><rect x="80" y="42" width="34" height="10" rx="2"/>
              </g>
              <g>
                <rect x="48" y="12" width="10" height="32" rx="2"/><rect x="48" y="52" width="10" height="32" rx="2"/><rect x="2" y="12" width="10" height="32" rx="2"/><rect x="14" y="42" width="34" height="10" rx="2"/>
                <rect x="80" y="0" width="34" height="10" rx="2"/><rect x="114" y="12" width="10" height="32" rx="2"/><rect x="80" y="86" width="34" height="10" rx="2"/><rect x="68" y="52" width="10" height="32" rx="2"/><rect x="80" y="42" width="34" height="10" rx="2"/>
              </g>
            </g>
          </svg>
          <div class="unit">公尺</div>
        </div>
        <svg class="ring" width="86" height="86" viewBox="0 0 86 86" aria-hidden="true">
          <circle cx="43" cy="43" r="36" fill="none" stroke="#182212" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="1.6 3.3"/>
          <circle cx="43" cy="43" r="2.2" fill="#182212"/>
          <circle cx="43" cy="30.4" r="5" fill="#FF4D1C"/>
          <circle cx="43" cy="30.4" r="8" fill="none" stroke="#FF4D1C" stroke-opacity="0.45"/>
        </svg>
      </div>
      <div class="verdict">
        <strong>在家</strong>
        <span>在範圍內，也連上住家 Wi-Fi</span>
      </div>
    </section>

    <section class="radius">
      <div class="rl"><span>安靜範圍</span><b>120 公尺</b></div>
      <div class="slot">
        <div class="fill"></div>
        <div class="knob"></div>
      </div>
      <div class="ends"><span>50</span><span>500</span></div>
    </section>

    <div class="duo">
      <section class="mod">
        <span class="k">WI-FI</span>
        <div class="big">也算在家</div>
        <div class="mod-row">
          <span class="sub">家裡-5G</span>
          <span class="latch on" aria-label="已開啟"><i></i></span>
        </div>
      </section>
      <section class="mod">
        <span class="k">HOME</span>
        <div class="coords">25.03396<br>121.56542</div>
        <div class="sub" style="margin-top:auto">剛剛更新</div>
      </section>
    </div>

    <div class="perms">
      <span><i></i>通知</span>
      <span><i></i>位置</span>
      <span><i></i>背景</span>
      <span><i></i>電池</span>
      <a href="apps.html">04 個應用</a>
    </div>
    <div class="keybtn">把目前位置設為家</div>
  </div>
  <nav>
    <a class="on" href="status.html"><em>01</em>狀態</a>
    <a href="apps.html"><em>02</em>應用</a>
    <a href="log.html"><em>03</em>紀錄</a>
  </nav>
</body>
</html>
