<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, height=844">
<title>在家安靜 — 開始 · 現場儀器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 390px; height: 844px; margin: 0; overflow: hidden;
    background: #E5DDD0;
    color: #171614;
    font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }
  button, a { font-family: inherit; color: inherit; text-decoration: none; }
  .mono { font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace; }

  .top {
    height: 40px; flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px 0;
  }
  .screw {
    width: 13px; height: 13px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #F4EFE6, #B7AFA2 46%, #6E675C 78%);
    box-shadow: inset 0 0 0 1px #5A544A, 0 1px 0 rgba(255,255,255,.55);
    position: relative;
  }
  .screw::after {
    content: ""; position: absolute; left: 2px; right: 2px; top: 5.5px; height: 1.5px;
    background: #3E3A34; border-radius: 1px;
  }
  .clock { font-size: 12px; letter-spacing: 0.12em; color: #3A342C; }
  .top .sp { flex: 1; }
  .rev { font-size: 10px; letter-spacing: 0.16em; color: #7A7268; }

  .brand {
    height: 46px; flex: none;
    display: flex; align-items: baseline; gap: 10px;
    padding: 4px 18px 0;
  }
  .brand b { font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace; font-size: 15px; letter-spacing: 0.08em; }
  .brand span { font-size: 13px; color: #6F685E; }

  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 16px 16px; gap: 12px; }

  .well {
    flex: 1.15; min-height: 0;
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #1A1916, #100F0D);
    border-radius: 10px;
    box-shadow: inset 0 0 0 1px #000, 0 1px 0 rgba(255,255,255,.45);
    color: #F3EEE4;
    padding: 16px 18px 18px;
    display: flex; flex-direction: column;
  }
  .well-top {
    display: flex; justify-content: space-between;
    font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.16em; color: #A8A092;
  }
  .well h1 {
    margin-top: 18px;
    font-size: 42px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15;
  }
  .well .lead {
    margin-top: 10px;
    font-size: 15px; line-height: 1.55; color: #D9D2C6; max-width: 300px;
  }
  .lamps { margin-top: auto; display: flex; gap: 8px; padding-top: 16px; }
  .lamps i {
    width: 11px; height: 11px; border-radius: 50%; display: block;
    background: #2A2723;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.7);
  }
  .lamps i.on {
    background: #FF4D1C;
    box-shadow: 0 0 0 3px rgba(255,77,28,.16), 0 0 8px rgba(255,77,28,.85);
  }

  .spec {
    flex: none;
    background: #D9D1C3;
    border-radius: 10px;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.06), inset 0 0 0 1px rgba(255,255,255,.35);
    padding: 4px 12px;
  }
  .spec li {
    list-style: none;
    display: flex; gap: 12px; align-items: center;
    min-height: 52px;
    border-top: 1px solid rgba(23,22,20,.1);
  }
  .spec li:first-child { border-top: 0; }
  .spec em {
    font-style: normal;
    font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace;
    font-size: 12px; color: #FF4D1C; width: 22px; flex: none;
  }
  .spec b { display: block; font-size: 15px; font-weight: 700; }
  .spec span { display: block; margin-top: 1px; font-size: 12px; color: #6F685E; }

  .go {
    flex: none; height: 56px;
    background: #FF4D1C; color: #1A100C;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; letter-spacing: 0.04em;
    box-shadow: 0 4px 0 #C4330C;
  }
  .hint {
    flex: none; text-align: center;
    font-family: "Noto Sans Mono CJK TC", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.14em; color: #7A7268;
  }
</style>
</head>
<body>
  <div class="top">
    <i class="screw"></i>
    <span class="clock mono">16:48</span>
    <span class="sp"></span>
    <span class="rev mono">HQ–1 · REV 1.4</span>
    <i class="screw"></i>
  </div>
  <div class="brand">
    <b>FIELD</b>
    <span>在家安靜</span>
  </div>
  <div class="stage">
    <section class="well">
      <div class="well-top"><span>MODE</span><span>01 / 06</span></div>
      <h1>到家就安靜</h1>
      <p class="lead">進入你設好的住家範圍時，這台會清掉所選應用的通知。人一離開，通知恢復。</p>
      <div class="lamps" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
    </section>
    <ul class="spec">
      <li><em>01</em><div><b>怎麼判斷在家</b><span>GPS、Wi-Fi、行動數據都可以</span></div></li>
      <li><em>02</em><div><b>預設安靜的對象</b><span>Grok Bot，之後可以再加</span></div></li>
      <li><em>03</em><div><b>走出範圍之後</b><span>通知維持原樣，不會一直清</span></div></li>
    </ul>
    <div class="go">繼續</div>
    <p class="hint">SIX STEPS · 先認識，再授權</p>
  </div>
</body>
</html>
