<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>在家安靜 · 紀錄</title>
<style>
  :root {
    --bg: #121212;
    --plate: #1C1C1C;
    --lime: #D4FF3A;
    --pink: #FF5FD2;
    --paper: #F4F4F4;
    --mute: #8A8A8A;
    --ink: #121212;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: var(--bg);
    color: var(--paper);
  }
  body {
    font-family: "Noto Sans CJK TC", sans-serif;
    font-weight: 400;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: monospace; }
  a { text-decoration: none; color: inherit; }

  .sb {
    height: 42px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
  }
  .sb .right { display: flex; align-items: center; gap: 6px; }

  .head { position: relative; padding: 4px 18px 8px; height: 108px; }
  .flag {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--lime);
  }
  .flag i {
    width: 9px;
    height: 9px;
    background: var(--pink);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  h1 {
    margin-top: 6px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .count {
    position: absolute;
    left: 18px;
    top: 78px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .count b { font-size: 16px; font-weight: 700; color: var(--pink); }
  .count span { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: var(--mute); }
  .blade { position: absolute; right: 16px; top: 18px; }

  .list { padding: 6px 14px 100px 12px; }
  .tix { position: relative; height: 86px; margin: 0 10px 14px 4px; }
  .tix:nth-child(even) { margin-left: 16px; margin-right: 0; }
  .tix .back, .tix .front {
    position: absolute;
    inset: 0;
    clip-path: polygon(
      0 0,
      calc(100% - 16px) 0,
      100% 16px,
      100% 100%,
      0 100%,
      0 64%,
      8px 50%,
      0 36%
    );
  }
  .tix .back { transform: translate(5px, 5px); }
  .tix:nth-child(odd) .back { background: var(--pink); }
  .tix:nth-child(even) .back { background: var(--lime); }
  .tix .front {
    background: #1A1A1A;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px 0 20px;
  }
  .ico {
    width: 36px;
    height: 36px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
  }
  .txt { flex: 1; min-width: 0; }
  .nm { font-size: 14px; font-weight: 700; }
  .tag {
    margin-top: 3px;
    font-size: 12px;
    font-weight: 400;
    color: var(--mute);
    letter-spacing: 0.08em;
  }
  .when {
    flex: none;
    background: var(--lime);
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 8px 4px 10px;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }

  .nav { position: absolute; left: 16px; right: 22px; bottom: 16px; height: 58px; z-index: 3; }
  .nav-back, .nav-front {
    position: absolute;
    inset: 0;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  }
  .nav-back { background: var(--pink); transform: translate(6px, 6px); }
  .nav-front {
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 10px 0 6px;
  }
  .nav-front a {
    font-size: 14px;
    font-weight: 700;
    color: #3A3A3A;
    letter-spacing: 0.06em;
  }
  .nav-front a.on span {
    background: var(--ink);
    color: var(--lime);
    padding: 7px 14px 7px 16px;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
</style>
</head>
<body>
  <div class="sb">
    <span class="mono">9:41</span>
    <span class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
        <polygon points="0,12 2.6,12 2.6,8 0,8" fill="#F4F4F4"/>
        <polygon points="4.4,12 7,12 7,5 4.4,5" fill="#F4F4F4"/>
        <polygon points="8.8,12 11.4,12 11.4,2.5 8.8,2.5" fill="#F4F4F4"/>
        <polygon points="13.2,12 15.8,12 15.8,0 13.2,0" fill="#D4FF3A"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <polygon points="0.6,1.2 19.2,1.2 21.2,3.2 21.2,10.8 2.6,10.8 0.6,8.8" fill="none" stroke="#F4F4F4" stroke-width="1.3"/>
        <polygon points="2.4,3.3 15.2,3.3 16.4,4.5 16.4,8.7 3.6,8.7 2.4,7.5" fill="#D4FF3A"/>
        <polygon points="22.4,4 24.2,4 24.2,8 22.4,8" fill="#F4F4F4"/>
      </svg>
      <span class="mono">87%</span>
    </span>
  </div>

  <header class="head">
    <div class="flag"><i></i>在家</div>
    <h1>紀錄</h1>
    <div class="count"><b class="mono">27</b><span>則</span></div>
    <svg class="blade" width="78" height="70" viewBox="0 0 78 70" aria-hidden="true">
      <polygon points="6,10 36,35 6,60 18,60 48,35 18,10" fill="#FF5FD2"/>
      <polygon points="22,16 46,35 22,54 32,54 56,35 32,16" fill="#D4FF3A"/>
      <polygon points="38,24 54,35 38,46 46,46 62,35 46,24" fill="#F4F4F4"/>
    </svg>
  </header>

  <div class="list">
    <div class="tix">
      <div class="back"></div>
      <div class="front">
        <i class="ico" style="background:#F4F4F4;color:#121212">G</i>
        <div class="txt"><div class="nm">Grok Bot</div><div class="tag">摘要</div></div>
        <span class="when mono">23:41</span>
      </div>
    </div>
    <div class="tix">
      <div class="back"></div>
      <div class="front">
        <i class="ico" style="background:#06C755">L</i>
        <div class="txt"><div class="nm">LINE</div><div class="tag">訊息</div></div>
        <span class="when mono">22:58</span>
      </div>
    </div>
    <div class="tix">
      <div class="back"></div>
      <div class="front">
        <i class="ico" style="background:#4A154B">S</i>
        <div class="txt"><div class="nm">Slack</div><div class="tag">#design</div></div>
        <span class="when mono">22:10</span>
      </div>
    </div>
    <div class="tix">
      <div class="back"></div>
      <div class="front">
        <i class="ico" style="background:#E1306C">I</i>
        <div class="txt"><div class="nm">Instagram</div><div class="tag">按讚</div></div>
        <span class="when mono">21:37</span>
      </div>
    </div>
    <div class="tix">
      <div class="back"></div>
      <div class="front">
        <i class="ico" style="background:#EA4335">G</i>
        <div class="txt"><div class="nm">Gmail</div><div class="tag">信件</div></div>
        <span class="when mono">20:14</span>
      </div>
    </div>
    <div class="tix">
      <div class="back"></div>
      <div class="front">
        <i class="ico" style="background:#06C755">L</i>
        <div class="txt"><div class="nm">LINE</div><div class="tag">群組</div></div>
        <span class="when mono">19:22</span>
      </div>
    </div>
  </div>

  <nav class="nav">
    <div class="nav-back"></div>
    <div class="nav-front">
      <a href="status.html">狀態</a>
      <a href="apps.html">應用</a>
      <a class="on" href="log.html"><span>紀錄</span></a>
    </div>
  </nav>
</body>
</html>
