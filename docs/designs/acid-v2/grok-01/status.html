<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>在家安靜 · 狀態</title>
<style>
  :root {
    --bg: #121212;
    --plate: #242424;
    --lime: #D4FF3A;
    --pink: #FF5FD2;
    --paper: #F4F4F4;
    --mute: #8A8A8A;
    --ink: #121212;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: var(--bg);
    color: var(--paper);
  }
  body {
    font-family: "Noto Sans CJK TC", sans-serif;
    font-weight: 400;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: monospace; }
  a { text-decoration: none; color: inherit; }

  .hero { position: relative; height: 404px; margin-bottom: 12px; }
  .hero-back, .hero-front {
    position: absolute;
    inset: 0;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 52px), 0 100%);
  }
  .hero-back { background: var(--pink); transform: translateY(7px); }
  .hero-front { background: var(--lime); color: var(--ink); }

  .sb {
    height: 42px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
  }
  .sb .right { display: flex; align-items: center; gap: 6px; }
  .sb .pct { font-size: 12px; letter-spacing: 0.04em; }

  .chip {
    position: absolute;
    left: 20px;
    top: 54px;
    height: 24px;
    padding: 0 12px 0 14px;
    display: inline-flex;
    align-items: center;
    background: var(--ink);
    color: var(--lime);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%);
  }
  h1 {
    position: absolute;
    left: 20px;
    top: 94px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .house { position: absolute; right: 2px; top: 70px; }

  .metrics {
    position: absolute;
    left: 20px;
    top: 164px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .metric .fig { display: flex; align-items: baseline; gap: 3px; }
  .metric .mono { font-size: 16px; font-weight: 700; letter-spacing: -0.03em; }
  .metric .u { font-size: 12px; font-weight: 700; }
  .metric .k {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    opacity: 0.62;
  }
  .sep {
    width: 10px;
    height: 10px;
    background: var(--pink);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    align-self: center;
    margin-bottom: 14px;
  }
  .meter { position: absolute; left: 20px; right: 20px; bottom: 58px; }

  .below {
    height: 428px;
    padding: 6px 16px 96px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .mid { display: flex; gap: 10px; height: 132px; flex: none; }
  .card { position: relative; flex: 1; }
  .card .back, .card .front, .pause .front {
    position: absolute;
    inset: 0;
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
  }
  .card .back { transform: translate(6px, 6px); }
  .card.pink .back { background: var(--ink); }
  .card.dark .back { background: var(--lime); }
  .card.pink .front { background: var(--pink); color: var(--ink); }
  .card.dark .front { background: var(--plate); color: var(--paper); }
  .card .front {
    padding: 14px 14px 12px 16px;
    display: flex;
    flex-direction: column;
  }
  .card .k {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
  }
  .card .bot {
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .card .n { font-size: 16px; font-weight: 700; }
  .sigs { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
  .sig { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
  .dia {
    width: 12px;
    height: 12px;
    background: var(--lime);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    flex: none;
  }

  .pause { position: relative; height: 60px; flex: none; }
  .pause .front {
    background: var(--plate);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 0 18px;
  }
  .pause .lbl { font-size: 14px; font-weight: 700; letter-spacing: 0.12em; }

  .strip { flex: none; height: 108px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
  .strip .k {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--mute);
  }
  .marks { display: flex; gap: 8px; }
  .mark { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .mark i {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
  }
  .mark span {
    font-size: 12px;
    font-weight: 700;
    color: var(--paper);
    white-space: nowrap;
  }

  .nav { position: absolute; left: 16px; right: 22px; bottom: 16px; height: 58px; z-index: 3; }
  .nav-back, .nav-front {
    position: absolute;
    inset: 0;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  }
  .nav-back { background: var(--pink); transform: translate(6px, 6px); }
  .nav-front {
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 10px 0 6px;
  }
  .nav-front a {
    font-size: 14px;
    font-weight: 700;
    color: #3A3A3A;
    letter-spacing: 0.06em;
  }
  .nav-front a.on span {
    background: var(--ink);
    color: var(--lime);
    padding: 7px 14px 7px 16px;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-back"></div>
    <div class="hero-front">
      <div class="sb">
        <span class="mono">9:41</span>
        <span class="right">
          <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
            <polygon points="0,12 2.6,12 2.6,8 0,8" fill="#121212"/>
            <polygon points="4.4,12 7,12 7,5 4.4,5" fill="#121212"/>
            <polygon points="8.8,12 11.4,12 11.4,2.5 8.8,2.5" fill="#121212"/>
            <polygon points="13.2,12 15.8,12 15.8,0 13.2,0" fill="#FF5FD2"/>
          </svg>
          <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
            <polygon points="0.6,1.2 19.2,1.2 21.2,3.2 21.2,10.8 2.6,10.8 0.6,8.8" fill="none" stroke="#121212" stroke-width="1.3"/>
            <polygon points="2.4,3.3 15.2,3.3 16.4,4.5 16.4,8.7 3.6,8.7 2.4,7.5" fill="#121212"/>
            <polygon points="22.4,4 24.2,4 24.2,8 22.4,8" fill="#121212"/>
          </svg>
          <span class="mono pct">87%</span>
        </span>
      </div>
      <div class="chip">開</div>
      <h1>在家</h1>
      <svg class="house" width="200" height="228" viewBox="0 0 180 206" aria-hidden="true">
        <polygon points="58,10 70,22 58,34 46,22" fill="#FF5FD2"/>
        <polygon points="74,2 82,10 74,18 66,10" fill="#F4F4F4"/>
        <polygon points="38,108 156,108 156,198 38,198" fill="#FF5FD2"/>
        <polygon points="108,18 128,18 128,80 108,80" fill="#121212"/>
        <polygon points="108,18 128,18 128,30 108,30" fill="#FF5FD2"/>
        <polygon points="90,34 170,104 10,104" fill="#121212"/>
        <polygon points="32,104 150,104 150,192 32,192" fill="#121212"/>
        <polygon points="78,134 108,126 108,192 78,192" fill="#FF5FD2"/>
        <polygon points="58,122 72,136 58,150 44,136" fill="#F4F4F4"/>
        <polygon points="116,124 138,124 142,128 142,146 116,146" fill="#F4F4F4"/>
        <polygon points="100,162 106,168 100,174 94,168" fill="#D4FF3A"/>
      </svg>
      <div class="metrics">
        <div class="metric">
          <div class="fig"><span class="mono">42</span><span class="u">m</span></div>
          <span class="k">距離</span>
        </div>
        <i class="sep"></i>
        <div class="metric">
          <div class="fig"><span class="mono">120</span><span class="u">m</span></div>
          <span class="k">半徑</span>
        </div>
      </div>
      <svg class="meter" height="16" viewBox="0 0 312 16" aria-hidden="true">
        <polygon points="2,1 13,8 2,15 7,15 18,8 7,1" fill="#121212"/>
        <polygon points="28,1 39,8 28,15 33,15 44,8 33,1" fill="#121212"/>
        <polygon points="54,1 65,8 54,15 59,15 70,8 59,1" fill="#121212"/>
        <polygon points="80,1 91,8 80,15 85,15 96,8 85,1" fill="#121212"/>
        <polygon points="106,1 117,8 106,15 111,15 122,8 111,1" fill="#121212" fill-opacity="0.28"/>
        <polygon points="132,1 143,8 132,15 137,15 148,8 137,1" fill="#121212" fill-opacity="0.28"/>
        <polygon points="158,1 169,8 158,15 163,15 174,8 163,1" fill="#121212" fill-opacity="0.28"/>
        <polygon points="184,1 195,8 184,15 189,15 200,8 189,1" fill="#121212" fill-opacity="0.28"/>
        <polygon points="210,1 221,8 210,15 215,15 226,8 215,1" fill="#121212" fill-opacity="0.28"/>
        <polygon points="236,1 247,8 236,15 241,15 252,8 241,1" fill="#121212" fill-opacity="0.28"/>
        <polygon points="262,1 273,8 262,15 267,15 278,8 267,1" fill="#121212" fill-opacity="0.28"/>
        <polygon points="288,1 299,8 288,15 293,15 304,8 293,1" fill="#121212" fill-opacity="0.28"/>
      </svg>
    </div>
  </div>

  <div class="below">
    <div class="mid">
      <div class="card pink">
        <div class="back"></div>
        <div class="front">
          <div class="k">清掉</div>
          <div class="bot">
            <b class="n mono">27</b>
            <svg width="88" height="70" viewBox="0 0 88 70" aria-hidden="true">
              <polygon points="16,1 64,1 76,13 76,19 16,19" fill="#121212"/>
              <polygon points="6,25 66,25 78,37 78,43 6,43" fill="#121212"/>
              <polygon points="14,49 72,49 84,61 84,69 14,69" fill="#121212"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="card dark">
        <div class="back"></div>
        <div class="front">
          <div class="sigs">
            <div class="sig"><i class="dia"></i>圍欄</div>
            <div class="sig"><i class="dia"></i>Wi-Fi</div>
          </div>
        </div>
      </div>
    </div>

    <div class="pause">
      <div class="front">
        <span class="lbl">暫停</span>
        <svg width="58" height="28" viewBox="0 0 58 28" aria-hidden="true">
          <polygon points="8,2 50,2 56,14 50,26 8,26 2,14" fill="#121212"/>
          <polygon points="16,7 23,14 16,21 9,14" fill="#F4F4F4"/>
        </svg>
      </div>
    </div>

    <div class="strip">
      <div class="k">靜音</div>
      <div class="marks">
        <div class="mark"><i style="background:#F4F4F4;color:#121212">G</i><span>Grok</span></div>
        <div class="mark"><i style="background:#06C755">L</i><span>LINE</span></div>
        <div class="mark"><i style="background:#E1306C">I</i><span>IG</span></div>
        <div class="mark"><i style="background:#4A154B">S</i><span>Slack</span></div>
      </div>
    </div>
  </div>

  <nav class="nav">
    <div class="nav-back"></div>
    <div class="nav-front">
      <a class="on" href="status.html"><span>狀態</span></a>
      <a href="apps.html">應用</a>
      <a href="log.html">紀錄</a>
    </div>
  </nav>
</body>
</html>
